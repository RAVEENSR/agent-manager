{{- $scheme := ternary "http" "https" .Values.thunder.configuration.server.httpOnly }}
{{- $port := .Values.thunder.configuration.server.port }}
{{- $thunderUrl := printf "%s://localhost:%d" $scheme (int $port) }}
{{/*
Shared registration script for the two public PKCE MCP clients (am-mcp and
am-obs-mcp). Takes a dict with:
  client — the client's values block (amMcpClient / amObsMcpClient)
  scopes — the list of OAuth2 scopes the client may request
*/}}
{{- define "amp-thunder.mcpClientScript" -}}
#!/bin/bash
set -e

SCRIPT_DIR="$(dirname "${BASH_SOURCE[0]:-$0}")"
source "${SCRIPT_DIR}/common.sh"


log_info "Checking if application '{{ .client.name }}' already exists..."

# Get the default OU ID
RESPONSE=$(api_call GET "/organization-units/tree/default")
HTTP_CODE="${RESPONSE: -3}"
BODY="${RESPONSE%???}"
if [[ "$HTTP_CODE" != "200" ]]; then
  log_error "Failed to fetch default organization unit (HTTP $HTTP_CODE)"
  echo "Response: $BODY"
  exit 1
fi
DEFAULT_OU_ID=$(echo "$BODY" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)

if [[ -z "$DEFAULT_OU_ID" ]]; then
  log_error "Could not extract default organization unit ID from response"
  echo "Response: $BODY"
  exit 1
fi
log_info "Using OU ID: $DEFAULT_OU_ID"

# Look up the default auth flow ID
RESPONSE=$(api_call GET "/flows?flowType=AUTHENTICATION&limit=200")
HTTP_CODE="${RESPONSE: -3}"
BODY="${RESPONSE%???}"
if [[ "$HTTP_CODE" != "200" ]]; then
  log_error "Failed to fetch authentication flows (HTTP $HTTP_CODE)"
  echo "Response: $BODY"
  exit 1
fi
AUTH_FLOW_ID=$(echo "$BODY" | sed 's/},{/}\n{/g' | grep '"handle":"default-basic-flow"' | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)

if [[ -z "$AUTH_FLOW_ID" ]]; then
  log_error "Could not find default-basic-flow authentication flow"
  exit 1
fi
log_info "Using auth flow ID: $AUTH_FLOW_ID"

# Check existing apps
RESPONSE=$(api_call GET "/applications")
HTTP_CODE="${RESPONSE: -3}"
BODY="${RESPONSE%???}"
if [[ "$HTTP_CODE" != "200" ]]; then
  log_error "Failed to fetch applications (HTTP $HTTP_CODE)"
  echo "Response: $BODY"
  exit 1
fi

APP_PAYLOAD='{
  "name": "{{ .client.name }}",
  "description": "{{ .client.description }}",
  "ouId": "'${DEFAULT_OU_ID}'",
  "authFlowId": "'${AUTH_FLOW_ID}'",
  "allowedUserTypes": {{ .client.allowedUserTypes | toJson }},
  "inboundAuthConfig": [
    {
      "type": "oauth2",
      "config": {
        "clientId": "{{ .client.clientId }}",
        "redirectUris": {{ .client.redirectUris | toJson }},
        "grantTypes": {{ .client.grantTypes | toJson }},
        "responseTypes": {{ .client.responseTypes | toJson }},
        "tokenEndpointAuthMethod": "{{ .client.tokenEndpointAuthMethod }}",
        "pkceRequired": {{ .client.pkceRequired }},
        "publicClient": {{ .client.publicClient }},
        "scopes": {{ .scopes | toJson }},
        "token": {
          "accessToken": {
            "validityPeriod": {{ .client.accessTokenValidityPeriod }},
            "userAttributes": {{ .client.userAttributes | toJson }}
          },
          "idToken": {
            "validityPeriod": {{ .client.idTokenValidityPeriod }},
            "userAttributes": {{ .client.userAttributes | toJson }}
          }
        }
      }
    }
  ]
}'

if echo "$BODY" | grep -q '"clientId":"{{ .client.clientId }}"'; then
  app_id=$(echo "$BODY" | sed 's/},{/}\n{/g' | grep '"clientId":"{{ .client.clientId }}"' | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
  log_info "Application '{{ .client.name }}' already exists (id: $app_id), updating..."
  RESPONSE=$(api_call PUT "/applications/$app_id" "$APP_PAYLOAD")
  HTTP_CODE="${RESPONSE: -3}"
  if [[ "$HTTP_CODE" == "200" ]]; then
    log_info "Application '{{ .client.name }}' updated successfully"
  else
    log_error "Failed to update application (HTTP $HTTP_CODE)"
    echo "Response: ${RESPONSE%???}"
    exit 1
  fi
else
  log_info "Application '{{ .client.name }}' does not exist, creating..."
  RESPONSE=$(api_call POST "/applications" "$APP_PAYLOAD")
  HTTP_CODE="${RESPONSE: -3}"
  if [[ "$HTTP_CODE" == "201" ]] || [[ "$HTTP_CODE" == "200" ]]; then
    log_info "Application '{{ .client.name }}' created successfully"
  elif [[ "$HTTP_CODE" == "409" ]]; then
    log_info "Application '{{ .client.name }}' already exists, skipping"
  else
    log_error "Failed to create application (HTTP $HTTP_CODE)"
    echo "Response: ${RESPONSE%???}"
    exit 1
  fi
fi
{{- end }}
