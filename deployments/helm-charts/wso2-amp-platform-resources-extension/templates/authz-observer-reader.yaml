---
# ClusterAuthzRole for the AM Observer outbound identity.
# The OpenChoreo observer backend authorizes every query through the
# control-plane PDP; these are the only actions am-observer's calls require:
# traces:view  → trace + span queries (/api/v1alpha1/traces/...)
# logs:view    → runtime logs AND build logs (build logs are a logs query
#                scoped to a workflowRun resource)
# metrics:view → metrics queries (/api/v1/metrics/query)
# alerts/incidents actions are intentionally omitted — am-observer never
# calls those endpoints. No built-in OpenChoreo role grants only these
# reads (rca-agent over-grants incidents:update + control-plane views), so
# this minimal role follows the amp-monitor-scheduler precedent.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterAuthzRole
metadata:
  name: amp-observer-reader
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  description: "Allows agent-manager-observer to read traces, logs, and metrics from the OpenChoreo observer"
  actions:
    - traces:view
    - logs:view
    - metrics:view
---
# ClusterAuthzRoleBinding for the AM Observer client.
# Matches on the client_id claim of am-observer-client's client_credentials
# tokens (the observer's auth config identifies service accounts by client_id).
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterAuthzRoleBinding
metadata:
  name: amp-observer-reader-binding
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  effect: allow
  entitlement:
    claim: client_id
    value: {{ .Values.authz.amObserverClient.clientId | default "am-observer-client" }}
  roleMappings:
    - roleRef:
        kind: ClusterAuthzRole
        name: {{ .Values.authz.amObserverClient.role | default "amp-observer-reader" }}
