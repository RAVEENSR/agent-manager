apiVersion: openchoreo.dev/v1alpha1
kind: ProjectType
metadata:
  name: default
  namespace: {{ .Values.openchoreoNamespace }}
  annotations:
    openchoreo.dev/display-name: {{ .Values.projectType.displayName | quote }}
    openchoreo.dev/description: {{ .Values.projectType.description | quote }}
  labels:
    openchoreo.dev/name: default
spec:
  # Per-environment overrides supplied via ProjectReleaseBinding.spec.environmentConfigs.
  environmentConfigs:
    openAPIV3Schema:
      type: object
      properties:
        namespaceLabels:
          type: object
          additionalProperties:
            type: string
          default: {}
        namespaceAnnotations:
          type: object
          additionalProperties:
            type: string
          default: {}
  # Minimal template: provision only the cell namespace per environment.
  resources:
    - id: cell-namespace
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: ${metadata.namespace}
          labels: ${oc_merge(metadata.labels, environmentConfigs.namespaceLabels)}
          annotations: ${environmentConfigs.namespaceAnnotations}
