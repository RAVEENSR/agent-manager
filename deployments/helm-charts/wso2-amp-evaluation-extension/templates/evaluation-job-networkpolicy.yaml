{{- if .Values.networkPolicy.evaluationJob.enabled }}
{{- $evalJobNamespace := .Values.networkPolicy.evaluationJob.namespace | default (printf "workflows-%s" (.Values.ampEvaluation.workflowNamespace | default "default")) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: amp-evaluation-job-egress
  namespace: {{ $evalJobNamespace }}
  labels:
{{- include "amp-evaluation-extension.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: amp-monitor
      app.kubernetes.io/component: evaluation-job
  policyTypes: [Egress]
  egress:
    # Scoped to the cluster DNS workload, not left open — this pod runs untrusted code.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.evaluationJob.dns.namespace }}
          podSelector:
            matchLabels:
              {{ .Values.networkPolicy.evaluationJob.dns.podLabel.key }}: {{ .Values.networkPolicy.evaluationJob.dns.podLabel.value }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

    # amp-observer (traces-observer-service) — fetch trace data to evaluate.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.evaluationJob.observer.namespace }}
      ports:
        - port: {{ .Values.networkPolicy.evaluationJob.observer.port }}
          protocol: TCP

    # amp-thunder IDP — mints the token used to call amp-observer and amp-api below.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.evaluationJob.idp.namespace }}
      ports:
        - port: {{ .Values.networkPolicy.evaluationJob.idp.port }}
          protocol: TCP

    # agent-manager-service publisher endpoint (amp-api) — publish evaluation scores.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.evaluationJob.publisher.namespace }}
      ports:
        - port: {{ .Values.networkPolicy.evaluationJob.publisher.port }}
          protocol: TCP

    # LLM gateway for llm_judge evaluators — unconditional since NetworkPolicy can't scope by workflow.
    # Two selectors, because the gateway's namespace is a deployment choice: the
    # per-org-env namespaces created by setup-gateway.sh / add-environment.sh carry the
    # label, while an install using the gateway chart's own apiGateway.namespace default
    # does not, and would otherwise be denied.
    - to:
        - namespaceSelector:
            matchLabels:
              amp.wso2.com/api-platform-gateway: "true"
        {{- with .Values.networkPolicy.evaluationJob.llmGateway.namespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: {{ .Values.networkPolicy.evaluationJob.llmGateway.port }}
          protocol: TCP

    {{- if .Values.networkPolicy.evaluationJob.devEgress.cidr }}
    # Local-dev only: agent-manager-service runs outside the cluster, so namespaceSelector can't match it.
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.evaluationJob.devEgress.cidr }}
      ports:
        - port: {{ .Values.networkPolicy.evaluationJob.devEgress.port }}
          protocol: TCP
    {{- end }}

    {{- $apiServerCIDR := .Values.networkPolicy.evaluationJob.apiServer.cidr }}
    {{- if not $apiServerCIDR }}
    {{- with lookup "v1" "Service" "default" "kubernetes" }}
    {{- $apiServerCIDR = printf "%s/32" .spec.clusterIP }}
    {{- end }}
    {{- end }}
    {{- if $apiServerCIDR }}
    # wait reports WorkflowTaskResults to the API server; no pod backs it, so only ipBlock matches.
    - to:
        - ipBlock:
            cidr: {{ $apiServerCIDR }}
      ports:
        - port: 443
          protocol: TCP
    {{- end }}
{{- end }}
