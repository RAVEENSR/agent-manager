# Default values for wso2-amp-evaluation-extension
# This chart deploys monitor evaluation workflows

# Global configuration (inherited from parent chart)
global:
  # -- Base domain for external access
  baseDomain: ""

  # -- Container registry configuration
  registry:
    # -- Registry endpoint for pushing and pulling images
    # For local registry: "host.k3d.internal:10082"
    # For external registry with baseDomain: automatically uses "registry.<baseDomain>"
    endpoint: "host.k3d.internal:10082"

# AMP Evaluation image configuration
ampEvaluation:
  # -- Docker image configuration for monitor evaluation
  image:
    # -- Image repository
    # For local development: will be pushed to local registry
    # For production: ghcr.io/wso2/amp-evaluation-monitor
    repository: "ghcr.io/wso2/amp-evaluation-monitor"

    # -- Image tag
    # IMPORTANT: For production, this should match the amp-evaluation SDK version
    # used in dbMigration.evaluatorGenerator.image.tag in the wso2-agent-manager chart.
    # Example: If using amp-evaluation==0.1.5, set this to "0.1.5"
    tag: "0.0.0-dev"

    # -- Image pull policy
    pullPolicy: "IfNotPresent"

  # -- Whether to use local registry or external image
  # When true, image will be prefixed with registry endpoint
  # When false, uses repository:tag directly (for k3d imported images or external registries)
  useLocalRegistry: false

  # -- In-cluster URL for the observer API
  tracesApiEndpoint: "http://amp-observer.openchoreo-observability-plane.svc.cluster.local:9098"

  # -- Publisher settings (for publishing evaluation scores to agent-manager)
  publisher:
    # -- In-cluster URL for the agent-manager API
    endpoint: "http://amp-api.wso2-amp.svc.cluster.local:9000"

    # -- OAuth2 client credentials for publisher authentication
    # The evaluation job uses these to obtain a Bearer token from Thunder
    # Note: clientSecret is loaded dynamically from OpenBao via ExternalSecret at workflow runtime
    idpTokenUrl: "http://amp-thunder-extension-service.amp-thunder.svc.cluster.local:8090/oauth2/token"
    clientId: "amp-publisher-client"

# Restricts the evaluation-job pod's egress (untrusted, user-submitted code) to just DNS,
# the traces observer, Thunder, the agent-manager-service publisher endpoint, and the LLM gateway.
networkPolicy:
  evaluationJob:
    # -- No-op on clusters whose CNI doesn't enforce NetworkPolicy (e.g. plain flannel).
    enabled: true

    # -- Empty derives "workflows-<ampEvaluation.workflowNamespace>" (where OpenChoreo runs this
    # environment's Argo workflows), not this chart's own release namespace.
    namespace: ""

    # -- DNS target on port 53, scoped rather than left wide open since this pod runs untrusted code.
    dns:
      namespace: "kube-system"
      podLabel:
        key: "k8s-app"
        value: "kube-dns"

    observer:
      namespace: "openchoreo-observability-plane"
      port: 9098

    publisher:
      namespace: "wso2-amp"
      port: 9000

    idp:
      namespace: "amp-thunder"
      port: 8090

    llmGateway:
      port: 22893
      # -- Namespace holding the API Platform Gateway, allowed in addition to any
      # namespace labelled amp.wso2.com/api-platform-gateway=true. That label is
      # only applied by setup-gateway.sh and add-environment.sh, so an install
      # that follows the gateway chart's own apiGateway.namespace default
      # (openchoreo-data-plane) has no matching namespace and llm_judge
      # evaluators are silently denied egress to the gateway. Empty = rely on
      # the label alone.
      namespace: ""

    # -- Local-dev only: ipBlock exception for agent-manager-service running outside the
    # cluster (docker-compose). Empty (no-op) elsewhere; setup-amp-extensions.sh sets it.
    devEgress:
      cidr: ""
      port: 8080

    # -- kube-apiserver CIDR for the wait sidecar; empty falls back to a live lookup (RBAC + install/upgrade only, so set explicitly otherwise).
    apiServer:
      cidr: ""
