# Traces Observer Service config
tracesObserver:
  enabled: true
  developmentMode: false
  name: amp-traces-observer
  replicaCount: 1
  image:
    repository: ghcr.io/wso2/amp-traces-observer
    tag: "0.0.0-dev"
    pullPolicy: IfNotPresent
  port: 9098
  resourceLimits:
    memory: 256Mi
    cpu: 500m
  resourceRequests:
    memory: 128Mi
    cpu: 250m
  service:
    # ClusterIP by default; external (browser) access is via the observability-
    # plane gateway HTTPRoute below. For a raw LoadBalancer in local dev, apply
    # values-dev.yaml.
    type: ClusterIP
  # HTTPRoute exposing the Traces Observer through the OpenChoreo observability-
  # plane gateway-default. The Traces Observer Service lives in that same
  # namespace, so no ReferenceGrant is needed.
  ocIngress:
    enabled: true
    hostname: "traces.amp.localhost"
    gateway:
      name: gateway-default
      # Empty means the chart's release namespace (the observability plane,
      # where both the gateway and the Traces Observer Service live).
      namespace: ""
  # Observer Service connection — the upstream service that provides trace data.
  observer:
    baseUrl: "http://observer.openchoreo-observability-plane.svc.cluster.local:8080"
    idpTokenUrl: "http://amp-thunder-extension-service.amp-thunder.svc.cluster.local:8090/oauth2/token"
    idpClientId: "amp-api-client"
    idpClientSecret: "amp-api-client-secret"
  # JWT authentication — must match the agent-manager keyManager config so the
  # same user token issued by Thunder is accepted by both services. Thunder
  # (v0.45+) stamps the resource-server identifier "amp" as the token audience,
  # so query tokens (console/CLI) carry aud=amp. Publisher tokens (aud
  # amp-publisher-*) are matched by a separate regex in the observer's auth
  # middleware and do not need to be listed here.
  auth:
    isLocalDevEnv: false
    jwksUrl: "http://amp-thunder-extension-service.amp-thunder.svc.cluster.local:8090/oauth2/jwks"
    issuer: "http://thunder.amp.localhost:8080"
    audience: "amp"

# OTLP/HTTP collector that ingests agent telemetry.
otelCollector:
  service:
    # ClusterIP by default. In-cluster agents already export to the gateway
    # runtime's /otel path over cluster DNS, so the collector needs no public
    # LoadBalancer. For a raw LoadBalancer in local dev, apply values-dev.yaml.
    type: ClusterIP
