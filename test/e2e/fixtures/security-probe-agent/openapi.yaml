openapi: 3.1.0
info:
  title: AMP Security Probe
  version: 1.0.0
  description: Deterministic, non-LLM runtime probe used only by AMP security tests.
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Probe process is ready.
  /security/runtime:
    get:
      operationId: runtimePosture
      responses:
        "200":
          description: Redacted sandbox posture booleans.
  /security/network/{target}:
    post:
      operationId: networkProbe
      parameters:
        - name: target
          in: path
          required: true
          schema:
            type: string
            enum: [kubernetes-api]
      responses:
        "200":
          description: Named network-probe outcome without response content.
        "404":
          description: Unknown target.
  /security/identity:
    post:
      operationId: agentIdentityProbe
      responses:
        "200":
          description: AgentID requested-scope and token-mint evidence without credentials.
  /security/mcp/{tool}:
    post:
      operationId: mcpAuthorizationProbe
      parameters:
        - name: tool
          in: path
          required: true
          schema:
            type: string
            enum: [echo, add]
      responses:
        "200":
          description: MCP authorization outcome without token or upstream response data.
        "404":
          description: Unknown tool.
