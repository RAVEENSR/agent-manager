name: Remaining Samples Local Smoke Checks
on:
  pull_request:
    paths:
      - 'samples/crewai-agent/**'
      - 'samples/customer-support-agent/**'
      - 'samples/dotnet-agent/**'
      - 'samples/leave-assistant-agent/**'
      - 'samples/manual-instrumentation-agent/**'
      - 'test/sample-smoke/remaining/**'
      - '.github/workflows/remaining-samples-pr-checks.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: remaining-samples-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      samples: ${{ steps.select.outputs.samples }}
      any: ${{ steps.select.outputs.any }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test selection and model failure guards
        run: python -m unittest discover -s test/sample-smoke/remaining -p 'test_*.py' -v
      - id: select
        name: Select changed samples
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python test/sample-smoke/remaining/select_samples.py
  smoke:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    name: Local smoke (${{ matrix.sample }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        sample: ${{ fromJSON(needs.changes.outputs.samples) }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v5
        if: matrix.sample == 'dotnet-agent'
        with:
          dotnet-version: '10.0.x'
      - name: Install Ballerina
        if: matrix.sample == 'leave-assistant-agent'
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/ballerina.deb" \
            https://github.com/ballerina-platform/ballerina-distribution/releases/download/v2201.13.4/ballerina-2201.13.4-swan-lake-linux-x64.deb
          echo "6f3939d5a008e0ea6b77b48b4eea5644513039e1516e3b1f135fa91685b8f4b0  $RUNNER_TEMP/ballerina.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/ballerina.deb"
          bal version
      - name: Install or build, start, and test the sample
        env:
          SAMPLE: ${{ matrix.sample }}
        run: python test/sample-smoke/remaining/run.py "$SAMPLE" --reports "$RUNNER_TEMP/smoke-reports"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: local-smoke-${{ matrix.sample }}
          path: ${{ runner.temp }}/smoke-reports/
